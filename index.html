<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion Google</title>
    <style>
      :root {
        --bg: #dfeaf6;
        --card: #f7f8fa;
        --text: #1f2937;
        --muted: #5d6878;
        --primary: #1a73e8;
        --primary-dark: #0d5bd7;
        --border: #dfe7f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .login-card {
        width: min(92vw, 430px);
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        box-shadow: 0 14px 38px rgba(47, 83, 128, 0.12);
        padding: 28px 26px 22px;
        backdrop-filter: blur(4px);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 18px;
      }

      .google-mark {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: conic-gradient(
          #4285f4 0 25%,
          #34a853 25% 50%,
          #fbbc05 50% 75%,
          #ea4335 75% 100%
        );
        position: relative;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
      }

      .google-mark::after {
        content: "";
        position: absolute;
        top: 7px;
        left: 7px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: white;
        clip-path: polygon(50% 0%, 100% 0%, 100% 50%, 50% 50%, 50% 100%, 0% 100%, 0% 50%, 50% 50%);
        opacity: 0.9;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 3rem);
        text-align: center;
        line-height: 1.2;
        font-weight: 700;
      }

      .subtitle {
        margin: 18px 0 28px;
        text-align: center;
        color: var(--muted);
        font-size: 1.04rem;
        line-height: 1.6;
      }

      .google-btn-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
      }

      #googleLoginBtn {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .custom-google-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        padding: 15px 18px;
        border: 2px solid #7da9f0;
        background: rgba(255, 255, 255, 0.75);
        border-radius: 12px;
        color: #1f2937;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(52, 84, 141, 0.08);
        transition: all 0.2s ease;
      }

      .custom-google-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(52, 84, 141, 0.12);
        background: #ffffff;
      }

      .g-icon {
        width: 20px;
        height: 20px;
        display: inline-grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.2rem;
        color: #1a73e8;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 22px 18px 20px;
        }

        .brand {
          font-size: 1.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand">
        <span class="google-mark"></span>
        <span>Google</span>
      </div>

      <h1>Connexion</h1>
      <p class="subtitle">Connectez-vous pour accéder à votre espace personnel.</p>

      <div class="google-btn-wrap">
        <div id="googleLoginBtn"></div>
      </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      const CLIENT_ID = "710336874373-2k2ie0e4ghplme2t9j2bl87eihkgekup.apps.googleusercontent.com";

      function saveUser(user) {
        localStorage.setItem("googleUser", JSON.stringify(user));
      }

      function redirectIfAlreadyLogged() {
        const user = localStorage.getItem("googleUser");
        if (user) {
          window.location.href = "accueil.html";
        }
      }

      function decodeJwtPayload(token) {
        const base64Url = token.split(".")[1];
        const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join("")
        );
        return JSON.parse(jsonPayload);
      }

      function handleCredentialResponse(response) {
        if (!response || !response.credential) {
          console.error("Réponse Google vide");
          return;
        }

        const payload = decodeJwtPayload(response.credential);
        const user = {
          name: payload.name || payload.email,
          email: payload.email,
          picture: payload.picture || "",
          token: response.credential
        };

        saveUser(user);
        window.location.href = "accueil.html";
      }

      window.onload = function () {
        redirectIfAlreadyLogged();

        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
          console.error("Google Identity Services n'est pas chargé.");
          return;
        }

        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: true
        });

        google.accounts.id.renderButton(document.getElementById("googleLoginBtn"), {
          theme: "outline",
          size: "large",
          width: "100%",
          text: "continue_with",
          logo_alignment: "left",
          shape: "rectangular"
        });
      };
    </script>
  </body>
</html>
