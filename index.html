<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion Google</title>
    <style>
      :root {
        --bg: #edf3ff;
        --card: rgba(255, 255, 255, 0.9);
        --text: #1f2937;
        --muted: #5f6f82;
        --border: #dfe8f3;
        --primary: #1a73e8;
        --primary-dark: #0d5bd8;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eaf1ff 0%, #eef6ff 45%, #f5f9ff 100%);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-card {
        width: min(94vw, 430px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: 0 18px 48px rgba(61, 92, 146, 0.14);
        padding: 30px 26px 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 2.1rem;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .g-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: conic-gradient(
          #4285f4 0 25%,
          #34a853 25% 50%,
          #fbbc05 50% 75%,
          #ea4335 75% 100%
        );
        position: relative;
        display: inline-block;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
      }

      .g-mark::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.4);
        clip-path: polygon(50% 50%, 100% 50%, 100% 100%, 50% 100%);
        border-radius: 50%;
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(2.2rem, 5vw, 3rem);
        line-height: 1.1;
      }

      .subtitle {
        margin: 18px auto 26px;
        max-width: 300px;
        text-align: center;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .google-btn-wrap {
        display: flex;
        justify-content: center;
      }

      #googleLoginBtn {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      @media (max-width: 420px) {
        .login-card {
          padding: 24px 18px 20px;
        }

        .brand {
          font-size: 1.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand">
        <span class="g-mark"></span>
        <span>Google</span>
      </div>

      <h1>Connexion</h1>
      <p class="subtitle">Connectez-vous pour accéder à votre espace personnel.</p>

      <div class="google-btn-wrap">
        <div id="googleLoginBtn"></div>
      </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      const CLIENT_ID = "710336874373-2k2ie0e4ghplme2t9j2bl87eihkgekup.apps.googleusercontent.com";

      function saveUser(user) {
        localStorage.setItem("googleUser", JSON.stringify(user));
      }

      function redirectIfAlreadyLogged() {
        const user = localStorage.getItem("googleUser");
        if (user) {
          window.location.href = "accueil.html";
        }
      }

      function decodeJwtPayload(token) {
        const base64Url = token.split(".")[1];
        const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join("")
        );
        return JSON.parse(jsonPayload);
      }

      function handleCredentialResponse(response) {
        if (!response || !response.credential) {
          console.error("Réponse Google vide");
          return;
        }

        const payload = decodeJwtPayload(response.credential);
        const user = {
          name: payload.name || payload.email,
          email: payload.email,
          picture: payload.picture || "",
          token: response.credential
        };

        saveUser(user);
        window.location.href = "accueil.html";
      }

      window.onload = function () {
        redirectIfAlreadyLogged();

        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
          console.error("Google Identity Services n'est pas chargé.");
          return;
        }

        window.google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: true
        });

        window.google.accounts.id.renderButton(document.getElementById("googleLoginBtn"), {
          theme: "outline",
          size: "large",
          width: "100%",
          text: "continue_with",
          shape: "pill",
          logo_alignment: "left"
        });
      };
    </script>
  </body>
</html>
